<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <style>
    body {font-family: Arial, sans-serif; background-color: #f9f9f9;
      display: flex; justify-content: center; align-items: center; height: 100vh;}
    .container {background: #fff; padding: 30px; border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px;}
    h2 {text-align: center; color: #333;}
    input {width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 5px;}
    button {width: 100%; padding: 12px; background: #007BFF; border: none;
      color: white; font-size: 16px; border-radius: 5px; cursor: pointer;}
    button:hover {background: #0056b3;}
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Profile</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" value="{{ request.user.username }}" required>
      <input type="email" name="email" value="{{ request.user.email }}" required>
      <button type="submit">Save Changes</button>
    </form>
    <br>
    <a href="{% url 'profile' %}">Back to Profile</a>
    {% for message in messages %}
      <p style="color:red;">{{ message }}</p>
    {% endfor %}
  </div>
</body>
</html>
