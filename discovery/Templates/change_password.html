<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <style>
    body {font-family: Arial, sans-serif; background-color: #f9f9f9;
      display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}
    .container {background: #fff; padding: 30px; border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px;}
    h2 {text-align: center; margin-bottom: 20px;}
    form input {width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;}
    button {width: 100%; padding: 10px; background: #007bff; border: none; color: #fff; border-radius: 5px; cursor: pointer;}
    button:hover {background: #0056b3;}
    .msg {color: red; text-align: center;}
  </style>
</head>
<body>
  <div class="container">
    <h2>Change Password</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Update Password</button>
    </form>
    {% for message in messages %}
      <p class="msg">{{ message }}</p>
    {% endfor %}
  </div>
</body>
</html>
