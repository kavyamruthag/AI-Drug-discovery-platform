<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - AI Drug Discovery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* LOGIN CARD */
.login-container{
    width:360px;
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(0,255,255,0.2);
    text-align:center;
}

/* TITLE */
.login-container h1{
    margin-bottom:10px;
    font-size:30px;
    background:linear-gradient(90deg,#00f5ff,#00ff99);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.login-container p{
    font-size:14px;
    color:#bdfcff;
    margin-bottom:30px;
}

/* INPUT FIELDS */
input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:14px;
}

input::placeholder{
    color:#c8f7ff;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(90deg,#00f5ff,#00ff99);
    color:#00333a;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 15px rgba(0,255,255,0.7);
}

/* MESSAGE */
.message{
    margin-top:15px;
    color:#ff6b6b;
    font-size:13px;
}

</style>
</head>

<body>

<div class="login-container">

    <h1>Admin Login</h1>
    <p>AI Drug Discovery Dashboard</p>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Admin ID" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

        
    </form>

</div>

</body>
</html>
