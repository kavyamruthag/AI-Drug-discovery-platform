<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drug Structure Visualization</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            width: 900px;
            max-width: 95%;
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 300px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 22px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            text-align: center;
            color: red;
            margin-bottom: 20px;
        }

        .result {
            margin-top: 20px;
        }

        .drug-name {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .structures {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: #f8f9ff;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #444;
        }

        .card img {
            max-width: 100%;
            border-radius: 10px;
            background: white;
            padding: 10px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 700px) {
            .structures {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Drug Structure Visualization</h1>
    <div class="subtitle">
        Machine Learning Based Drug Discovery System
    </div>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="drug" placeholder="Enter drug name (e.g., Paracetamol)" required>
        <button type="submit">Visualize</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if cid %}
        <div class="result">
            <div class="drug-name">
                Drug Selected: {{ drug }}
            </div>

            <div class="structures">
                <div class="card">
                    <h3>2D Molecular Structure</h3>
                    <img src="https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{{ cid }}/PNG">
                </div>

                <div class="card">
                    <h3>3D Molecular Structure</h3>
                    <img src="https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{{ cid }}/PNG?record_type=3d">
                </div>
            </div>
        </div>
    {% endif %}

    <footer>
        © 2026 Drug Discovery ML Project | Structure Visualization Module
    </footer>
</div>

</body>
</html>
