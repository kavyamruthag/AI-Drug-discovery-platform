<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drug Structure Visualization</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;

    background: linear-gradient(
        135deg,
        #0f2027 0%,
        #203a43 40%,
        #2c5364 100%
    );
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
}

/* Animated particles */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image:
        radial-gradient(circle at 25% 35%, rgba(0,255,255,0.15) 2px, transparent 2px),
        radial-gradient(circle at 75% 70%, rgba(0,200,255,0.15) 2px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(0,255,200,0.1) 2px, transparent 2px);
    background-size: 300px 300px;
    animation: moveStars 50s linear infinite;
    z-index: 0;
}

@keyframes moveStars {
    from { background-position: 0 0; }
    to { background-position: 1200px 1200px; }
}

.container {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    width: 950px;
    max-width: 95%;
    border-radius: 25px;
    padding: 40px;
    border: 1px solid rgba(0,255,255,0.25);
    box-shadow:
        0 0 30px rgba(0,255,255,0.25),
        0 0 60px rgba(0,200,255,0.15);
    position: relative;
    z-index: 2;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
    text-shadow:
        0 0 10px rgba(0,255,255,0.6),
        0 0 20px rgba(0,200,255,0.5);
}

.subtitle {
    text-align: center;
    color: #ccefff;
    margin-bottom: 30px;
    font-size: 15px;
}

form {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
}

input[type="text"] {
    width: 320px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

input::placeholder {
    color: #ccefff;
}

input:focus {
    border-color: #00ffff;
    box-shadow: 0 0 10px rgba(0,255,255,0.7);
}

button {
    padding: 12px 24px;
    background: linear-gradient(90deg, #00ffff, #00bfff);
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(0,255,255,0.9);
}

.error {
    text-align: center;
    color: #ff4d4d;
    margin-bottom: 20px;
}

.result {
    margin-top: 20px;
}

.drug-name {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #00ffff;
}

.structures {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    border: 1px solid rgba(0,255,255,0.2);
    transition: 0.3s;
}

.card:hover {
    box-shadow: 0 0 25px rgba(0,255,255,0.6);
}

.card h3 {
    margin-bottom: 15px;
    color: #ccefff;
}

.card img {
    max-width: 100%;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    padding: 10px;
}

footer {
    margin-top: 35px;
    text-align: center;
    font-size: 13px;
    color: #ccefff;
}

@media (max-width: 700px) {
    .structures {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Drug Structure Visualization</h1>
    <div class="subtitle">
        Machine Learning Based Drug Discovery System
    </div>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="drug" placeholder="Enter drug name" required>
        <button type="submit">Visualize</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if cid %}
        <div class="result">
            <div class="drug-name">
                Drug Selected: {{ drug }}
            </div>

            <div class="structures">
                <div class="card">
                    <h3>2D Molecular Structure</h3>
                    <img src="https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{{ cid }}/PNG">
                </div>

                <div class="card">
                    <h3>3D Molecular Structure</h3>
                    <img src="https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{{ cid }}/PNG?record_type=3d">
                </div>
            </div>
        </div>
    {% endif %}

    <footer>
        © 2026 Drug Discovery ML Project | Structure Visualization Module
    </footer>
</div>

</body>
</html>
