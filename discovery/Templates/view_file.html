<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ filename }}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white shadow-md rounded-2xl p-6">
    <h1 class="text-xl font-semibold mb-3 text-blue-600">{{ filename }}</h1>
    <pre class="bg-gray-100 p-4 rounded-md overflow-x-auto text-sm text-gray-800 border border-gray-200">{{ content }}</pre>
    <a href="{% url 'resources' %}" class="mt-4 inline-block bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">⬅ Back</a>
  </div>
</body>
</html>
